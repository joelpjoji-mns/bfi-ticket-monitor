name: BFI IMAX Ticket Monitor

on:
  schedule:
    # Runs every 5 minutes, 24/7
    - cron: '*/5 * * * *'
  # Also lets you trigger it manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run ticket check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check.js
